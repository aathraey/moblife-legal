  <title>MobLife · Legal</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    @font-face { font-family: 'Pixelify Sans'; font-weight: 400; font-display: swap; src: url('fonts/pixelify-sans-400.ttf') format('truetype'); }
    @font-face { font-family: 'Pixelify Sans'; font-weight: 600; font-display: swap; src: url('fonts/pixelify-sans-600.ttf') format('truetype'); }
    @font-face { font-family: 'Press Start 2P'; font-weight: 400; font-display: swap; src: url('fonts/press-start-2p.ttf') format('truetype'); }
    :root { --ink: #2B211A; --mid: #574333; --paper: #FFF4DA; --panel: #EFE0BC; --line: #D8C59A; --amber: #AD4C18; }
    * { font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; }
    html { background: var(--paper); }
    body { font: 400 18px/1.6 'Pixelify Sans', system-ui, sans-serif; color: var(--ink); background: var(--paper); max-width: 760px; margin: 0 auto; padding: 32px 20px 56px; }
    h1 { font: 400 20px/1.5 'Press Start 2P', monospace; margin: 0 0 8px; }
    h2 { font-size: 22px; font-weight: 600; margin: 32px 0 8px; padding-top: 18px; border-top: 2px solid var(--line); }
    p, li { color: var(--ink); }
    .meta { color: var(--mid); font-size: 15px; margin-bottom: 28px; }
    a { color: var(--amber); text-underline-offset: 4px; }
    a:focus-visible, summary:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
    table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 15px; display: block; overflow-x: auto; }
    th, td { border: 2px solid var(--ink); padding: 8px 10px; text-align: left; vertical-align: top; }
    th { background: var(--panel); font-weight: 600; }
    details { border: 2px solid var(--ink); background: var(--paper); box-shadow: 4px 4px 0 var(--line); padding: 12px 16px; margin-bottom: 14px; }
    summary { font-weight: 600; cursor: pointer; }
    ul, ol { padding-left: 22px; }
    li { margin: 6px 0; }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; font: 400 14px 'Press Start 2P', monospace; color: var(--ink); text-decoration: none; }
  </style>
</head>
